services:
  film-calculator:
    build: .
    # No host port — only reachable by nginx over the internal network
    init: true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    init: true
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      # Uncomment after placing SSL certs in nginx/certs/
      - ./nginx/certs:/etc/nginx/certs:ro
    # Substitute ${DOMAIN} (and ${FIYAVALHU_DOMAIN}, for the second app sharing
    # this nginx) from .env into the config before nginx starts.
    # $${DOMAIN} escapes docker-compose interpolation so the shell receives $DOMAIN.
    # FIYAVALHU_DOMAIN defaults to a non-matchable placeholder (RFC 2606
    # reserved .invalid TLD) if unset in .env, so a missing value there can
    # never produce an empty server_name and break nginx config parsing -
    # this app's own server_name is left completely unaffected either way.
    command: sh -c "export FIYAVALHU_DOMAIN=$${FIYAVALHU_DOMAIN:-fiyavalhu.invalid}; envsubst '$${DOMAIN} $${FIYAVALHU_DOMAIN}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    depends_on:
      film-calculator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
    # Explicit fixed name so other projects' docker-compose files (e.g. the
    # FiyavalhuMV bot's future web UI) can join this network reliably as
    # `external: true`, without having to guess Compose's auto-derived
    # "<folder-name>_internal" project name.
    name: film_calculator_internal
