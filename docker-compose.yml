services:
  film-calculator:
    build: .
    # Bound to loopback only — a host-level Caddy reverse proxy (not part of
    # this compose stack) terminates TLS and forwards to this port. Never
    # publish this on a public interface directly.
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    init: true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
